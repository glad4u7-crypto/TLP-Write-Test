name: Agent Foundation CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "feature/agent-v0.3-zero-cost-core"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apaa-agent-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Audit Python dependencies
        run: python -m pip install pip-audit && pip-audit -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py core tests
      - name: Run foundation tests
        run: python -m pytest -q

  linux-egress-qualification:
    name: Disposable Linux egress namespace qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Install isolated network test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 nftables
      - name: Report hosted-runner qualification limitation
        run: |
          echo "::notice::SKIPPED: this hosted runner cannot provide the required network namespace, veth, nftables and IPv6 kernel capabilities."
          echo "No operational egress qualification result is claimed. Run scripts/qualify_linux_egress_namespace.sh only on a disposable Linux runner with the required capabilities."
