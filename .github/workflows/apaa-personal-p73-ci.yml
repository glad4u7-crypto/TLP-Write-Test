name: APAA Personal Edition P73 Verification
on:
  pull_request:
    branches: ["apaa-s09-c01-action-audit-remediation-01"]
permissions:
  contents: read
concurrency:
  group: apaa-p73-${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py core tests scripts
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Run complete test suite
        run: python -m pytest -q
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Run responsive browser smoke tests
        run: python -m pytest -q tests/test_android_viewport_smoke.py tests/test_pc_browser_smoke.py
