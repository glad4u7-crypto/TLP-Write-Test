name: APAA Android Viewport Smoke

on:
  pull_request:
    branches: ["main", "feature/agent-v0.3-zero-cost-core"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apaa-android-viewport-${{ github.event.pull_request.number || github.ref }} 
  cancel-in-progress: true

jobs:
  pixel-viewport-emulation:
    name: Pixel 7 viewport emulation (not physical-device qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install application and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run Android-sized browser smoke tests
        run: python -m pytest -q tests/test_android_viewport_smoke.py
