name: APAA P74 diagnostic and symbolication targeted tests

on:
  push:
    branches:
      - feature/apaa-p74-chromium-fd-diagnostics
  pull_request:
    branches:
      - feature/apaa-s09-c01-action-history-clean

permissions:
  contents: read

jobs:
  p74-diagnostic-tests:
    name: FD diagnostics, parser and exact-build symbolication tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest cryptography
      - name: Run P74 diagnostics and symbolication tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q \
            tests/test_chromium_fd_diagnostics.py \
            tests/test_chromium_fd_ownership_log.py \
            tests/test_p74_real_worker_script.py \
            tests/test_symbolicate_chromium_fd_evidence.py
