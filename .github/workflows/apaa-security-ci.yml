name: APAA Security CI

on:
  push:
    branches:
      - feature/apaa-s09-c01-p01-browser-launch
  pull_request:
    branches:
      - main
      - master
      - feature/apaa-s09-c01-p01-browser-launch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apaa-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    name: Python security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q
