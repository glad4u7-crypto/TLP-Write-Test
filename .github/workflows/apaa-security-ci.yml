name: APAA Security CI

on:
  push:
    branches:
      - feature/apaa-s09-c01-p01-browser-launch
  pull_request:
    branches:
      - main
      - master
      - feature/apaa-s09-c01-p01-browser-launch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apaa-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-tests:
    name: Python security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Chromium certificate-store tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Chromium TLS — trusted CA accepted
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q
          tests/test_chromium_tls_integration.py::test_chromium_accepts_certificate_signed_by_trusted_test_ca
      - name: Chromium TLS — hostname mismatch rejected
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q
          tests/test_chromium_tls_integration.py::test_chromium_rejects_trusted_certificate_with_hostname_mismatch
      - name: Chromium TLS — expired certificate rejected
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q
          tests/test_chromium_tls_integration.py::test_chromium_rejects_expired_certificate_signed_by_trusted_test_ca
      - name: Live browsing — controller policy and lifecycle
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/test_live_browsing.py
      - name: Live browsing — real Chromium through restricted local proxy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q
          tests/test_chromium_tls_integration.py::test_live_browsing_controller_reads_from_real_chromium_over_restricted_local_proxy
      - name: Run remaining security test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q --ignore=tests/test_chromium_tls_integration.py
